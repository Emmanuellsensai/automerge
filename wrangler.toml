name = "automerge"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 database — create with:
#   npx wrangler d1 create automerge
#   npx wrangler d1 execute automerge --remote --file=migrations/0001_initial.sql
#   npx wrangler d1 execute automerge --local  --file=migrations/0001_initial.sql
[[d1_databases]]
binding = "DB"
database_name = "automerge"
database_id = "3ad5b82b-a742-446e-abf5-80f83bca3151"

# Secrets (set via `wrangler secret put <NAME>`):
#   DISCORD_PUBLIC_KEY        - from Discord dev portal, General Info
#   DISCORD_APPLICATION_ID    - from Discord dev portal
#   DISCORD_BOT_TOKEN         - from Discord dev portal, Bot
#   GITHUB_APP_ID             - from GitHub app settings
#   GITHUB_APP_PRIVATE_KEY    - PEM string, from GitHub app
#   GITHUB_WEBHOOK_SECRET     - shared secret set on the GitHub App
#   ENCRYPTION_KEY            - 32-byte base64, used to encrypt user Gemini keys at rest
