name = "automerge"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron: every minute. Polls issue-claim channels each tick and sweeps open PRs every
# SWEEP_INTERVAL_MINUTES (see [vars]).
[triggers]
crons = ["* * * * *"]

[vars]
# Public base URL of the Worker. Used to build the GitHub OAuth callback URL.
PUBLIC_BASE_URL = "https://automerge.automergewave.workers.dev"
# Gemini model used for reviews. Change it here if Google releases a newer one.
GEMINI_MODEL = "gemini-3.8-flash"
# Backup reviewer, used only when Gemini is rate-limited, out of quota, overloaded, unavailable, or times out.
ANTHROPIC_MODEL = "claude-haiku-4-5"
# Background check of open PRs (webhooks still review instantly). Every 5 minutes it reviews
# at most 2 PRs that are new, changed, or waiting on CI. Raise slowly to stay under rate limits.
SWEEP_INTERVAL_MINUTES = "5"
SWEEP_MAX_PRS = "2"

# D1 database — create with:
#   npx wrangler d1 create automerge
#   npx wrangler d1 execute automerge --remote --file=migrations/0001_initial.sql
#   npx wrangler d1 execute automerge --local  --file=migrations/0001_initial.sql
[[d1_databases]]
binding = "DB"
database_name = "automerge"
database_id = "3ad5b82b-a742-446e-abf5-80f83bca3151"

# Secrets (set via `wrangler secret put <NAME>`):
#   DISCORD_PUBLIC_KEY        - from Discord dev portal, General Info
#   DISCORD_APPLICATION_ID    - from Discord dev portal
#   DISCORD_BOT_TOKEN         - from Discord dev portal, Bot
#   GITHUB_APP_ID             - from GitHub app settings
#   GITHUB_APP_PRIVATE_KEY    - PEM string, from GitHub app
#   GITHUB_WEBHOOK_SECRET     - shared secret set on the GitHub App
#   ENCRYPTION_KEY            - 32-byte base64, used to encrypt user API keys at rest
#   GITHUB_OAUTH_CLIENT_ID    - OAuth App (separate from the GitHub App)
#   GITHUB_OAUTH_CLIENT_SECRET - OAuth App client secret
